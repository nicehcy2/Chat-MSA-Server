CHAT_MEMBERSHIP_TOPIC: 'chat-membership-topic' # 멤버십 이벤트(JOINED/LEFT/KICKED). chat-service가 시스템 메시지 저장과 세션 종료에 사용
CHAT_MESSAGE_PAGE_MAX_SIZE: 100

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/chatdb
    username: guest
    password: guest
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    hibernate:
      ddl-auto: none

  application:
    name: chat-api-service
      #security:
      #oauth2:
      #resourceserver:
      #jwt:
      #issuer-uri: http://keycloak:8080/realms/spmia-realm
      #client:
      #registration:
      #keycloak:
      #authorization-grant-type: client_credentials
      #client-id: ostock
      #client-secret: 0VFvtUzzrORmAVqcgykHSzwiaKc5615O
      #provider: keycloak
      #provider:
      #keycloak:
    #issuer-uri: http://keycloak:8080/realms/spmia-realm

  kafka:
    bootstrap-servers: Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: 8180

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://eurekaserver:8070/eureka/

jwt:
  auth:
    converter:
      resource-id: ostock
      principal-attribute: preferred_username