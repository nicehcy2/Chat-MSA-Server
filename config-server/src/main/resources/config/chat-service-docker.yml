CHAT_NODE_ID: chat-messages-group1 # 컨테이너/vm마다 고유값 주입
ONLINE_KEY_PREFIX: 'socket:online:'
IDEMPOTENCY_TTL_DAYS: 1
PUSH_GROUP_ID: 'push-notification-group'
CHAT_TOPIC: 'chat-topic'
CHAT_READ_TOPIC: 'chat-read-topic' # 읽음 이벤트 전용 토픽 (메시지 토픽과 분리)
CHAT_MEMBERSHIP_TOPIC: 'chat-membership-topic' # 멤버십 이벤트 토픽 (chat-api-service가 발행, 전 노드가 수신해 시스템 메시지 저장·세션 종료)
USER_PROFILE_TOPIC: 'user-profile-topic' # user-service 프로필 변경 이벤트 (user_outbox → Debezium). chat_user_profile 사본 갱신
USER_PROFILE_GROUP_ID: 'chat-user-profile-group' # DB 쓰기라 전 노드가 공유하는 단일 그룹

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/chatdb
    username: guest
    password: guest

  data:
    redis:
      host: redis # redis_container
      port: 6379

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    hibernate:
      ddl-auto: update

  # Kafka ?? ??
  kafka:
    bootstrap-servers: Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false  # 헤더 안 붙이도록 설정
    consumer:
      group-id: chat-messages-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.nicehcy.chatservice.dto
        spring.json.value.default.type: com.nicehcy.chatservice.dto.MessageResponseDto

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://eurekaserver:8070/eureka/

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: W3C
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

jwt:
  secret: "Y69LhQRsm/zGEMqQTNuyeeXFdrqqfPpIAnXmZttuLsg="

server:
  port: 8080